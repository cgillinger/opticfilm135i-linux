name: offline checks

# Hardware-free regression gate. Runs the generated-table check and
# tools/release_check.py --no-backend (the Python offline suites and the
# compiler-based probe suites). It never
# builds the full SANE backend and never touches a scanner -- see
# docs/offline-checks.md, which this job mirrors. The three backend
# suites (check 5 there) need a built libsane-genesys.so and stay a
# local step.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade numpy pillow tifffile pyusb

      - name: g++ version (compiler-based suites need it)
        run: g++ --version

      - name: Generated-table consistency
        run: python tools/gen_sane_tables.py --check

      # One list, kept in tools/release_check.py (SUITES): every core
      # and compiler-based suite must run every test and pass. The
      # backend suites skip here and --no-backend says so in the verdict.
      - name: Offline suites (tools/release_check.py --no-backend)
        run: python tools/release_check.py --no-backend
